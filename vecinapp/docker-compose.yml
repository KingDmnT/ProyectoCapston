services:
  # Servicio Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vecinapp_backend
    ports:
      - "8000:8000"
    volumes:
      # Montamos las credenciales para que el contenedor tenga acceso
      - ./credentials:/app/credentials
      - ./backend/app:/app/app
      # Montamos los assets del frontend para acceder al logo
      - ./frontend/assets:/app/frontend/assets:ro
    env_file:
      - ./backend/.env
    environment:
      # Configuramos la ruta de credenciales para Docker
      - FIREBASE_CREDENTIALS_PATH=/app/credentials/serviceAccountKey.json
      # Pasamos variables de entorno necesarias (puedes agregar más aquí o usar env_file)
      - FIREBASE_SERVICE_ACCOUNT_KEY=/app/credentials/serviceAccountKey.json
    networks:
      - vecinapp_network

  # Servicio Frontend Unificado (Flutter Web - Admin + Mobile)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vecinapp_frontend
    ports:
      - "3000:80" # Backoffice web
    depends_on:
      - backend
    networks:
      - vecinapp_network

networks:
  vecinapp_network:
    driver: bridge
