services:
  # Servicio Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vecinapp_backend
    ports:
      - "8000:8000"
    volumes:
      # Montamos las credenciales para que el contenedor tenga acceso
      - ./credentials:/app/credentials
    environment:
      # Configuramos la ruta de credenciales para Docker
      - FIREBASE_CREDENTIALS_PATH=/app/credentials/serviceAccountKey.json
      # Pasamos variables de entorno necesarias (puedes agregar más aquí o usar env_file)
      - FIREBASE_SERVICE_ACCOUNT_KEY=/app/credentials/serviceAccountKey.json
    networks:
      - vecinapp_network

  # Servicio Frontend (Flutter Web)
  admin_web:
    build:
      context: ./admin_web
      dockerfile: Dockerfile
    container_name: vecinapp_admin_web
    ports:
      - "3000:80" # Mapeamos puerto 3000 del host al 80 del contenedor
    depends_on:
      - backend
    networks:
      - vecinapp_network

networks:
  vecinapp_network:
    driver: bridge
