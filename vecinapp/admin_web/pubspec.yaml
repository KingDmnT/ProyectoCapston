name: admin_web
description: "Panel de administración web para VecinApp."
# Evita publicación accidental en pub.dev
publish_to: 'none' 

# Versionamiento semántico: Major.Minor.Patch + Build Number
version: 1.0.0+1

environment:
  # Versión de Dart compatible con Flutter 3.10+
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Estilos ---
  # Iconos estilo iOS
  cupertino_icons: ^1.0.8
  # Fuentes de Google
  google_fonts: ^6.3.3

  # --- Backend & Conectividad ---
  # Autenticación con Firebase
  firebase_auth: ^6.1.2
  # Core de Firebase
  firebase_core: ^4.2.1
  # Peticiones HTTP
  http: ^1.6.0
  # Gestión de estado
  provider: ^6.1.5+1
  # Manejo de variables de entorno (.env)
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Reglas de linter recomendadas para Flutter
  flutter_lints: ^6.0.0

flutter:
  # Habilita iconos Material Design
  uses-material-design: true

  # --- Assets ---
  # Incluimos el archivo .env para configuración
  assets:
    - .env
