name: vecinapp
description: "Aplicación unificada de gestión de condominios - VecinApp"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Estilos
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  google_nav_bar: ^5.0.6
  quickalert: ^1.0.2
  
  # Funcionalidades Mobile (de vecinapp2)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  url_launcher: ^6.3.0
  image_picker: ^1.1.2  # Versión compatible con Dart 3.5.4
  carousel_slider: ^5.0.0
  
  # Funcionalidades Admin (de admin_web)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  intl: ^0.19.0
  file_picker: ^6.1.1
  excel: ^4.0.0
  fl_chart: ^0.69.0  # Gráficos para dashboard
  
  # Backend & Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.0
  http: ^1.2.0
  
  # Gestión de Estado y Configuración
  provider: ^6.1.2
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - .env
